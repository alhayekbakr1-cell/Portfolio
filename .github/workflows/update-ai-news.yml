name: Update AI news feed

on:
  push:
    branches:
      - main
    paths:
      - scripts/update-ai-news.mjs
      - .github/workflows/update-ai-news.yml
      - public/ai-news.json
  schedule:
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ai-news-feed
  cancel-in-progress: false

jobs:
  update-ai-news:
    name: Refresh weekly AI updates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh AI news data
        run: node scripts/update-ai-news.mjs

      - name: Commit updated feed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: refresh weekly AI news feed'
          file_pattern: public/ai-news.json
